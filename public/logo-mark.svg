<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 40 40" fill="none" role="img" aria-label="FlowGate logo mark">
  <rect width="40" height="40" rx="10" fill="#122d45"/>
  <!-- Left pillar -->
  <rect x="6"  y="7"  width="6.5" height="26" rx="3.25" fill="white"/>
  <!-- Right pillar -->
  <rect x="27.5" y="7" width="6.5" height="26" rx="3.25" fill="white"/>
  <!-- Flow bars — wider at top, narrower at bottom (gate narrows to measure) -->
  <rect x="15" y="9"   width="10" height="3.5" rx="1.75" fill="#1061a6"/>
  <rect x="16.5" y="17" width="7"  height="3.5" rx="1.75" fill="#1061a6"/>
  <rect x="18" y="25"  width="4"  height="3.5" rx="1.75" fill="#1061a6" opacity="0.85"/>
</svg>
