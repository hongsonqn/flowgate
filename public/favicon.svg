<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- FlowGate mark: two pillars with a tapering channel — the gate that meers flow -->
  <rect width="32" height="32" rx="7" fill="#122d45"/>
  <!-- Left pillar -->
  <rect x="5" y="6" width="5" height="20" rx="2.5" fill="white"/>
  <!-- Right pillar -->
  <rect x="22" y="6" width="5" height="20" rx="2.5" fill="white"/>
  <!-- Flow channel — three horizontal bars tapering to suggest flow passing through the gate -->
  <rect x="12" y="8"  width="8" height="2.5" rx="1.25" fill="#1061a6" opacity="0.9"/>
  <rect x="13" y="14" width="6" height="2.5" rx="1.25" fill="#1061a6"/>
  <rect x="14" y="20" width="4" height="2.5" rx="1.25" fill="#1061a6" opacity="0.85"/>
</svg>
